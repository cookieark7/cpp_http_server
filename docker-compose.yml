version: '3.8'

services:
  # --- Service 1: PostgreSQL Database ---
  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      # Expose port 5432 to your Mac so you can still use terminal/TablePlus to view it
      - "5432:5432" 
    volumes:
      # This ensures your database isn't deleted when the container stops
      - pgdata:/var/lib/postgresql/data

  # --- Service 2: Your C++ Server ---
  api:
    build: . # Tells Docker to use the Dockerfile in this folder
    env_file:
      - .env
    depends_on:
      - db
    restart: on-failure # If the C++ server starts before Postgres is ready and crashes, it will automatically restart

  # --- Service 3: Nginx Reverse Proxy ---
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    restart: on-failure

  # --- Service 4: Certbot (Let's Encrypt) ---
  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot

volumes:
  pgdata:
